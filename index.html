
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my little corner ♡</title>
<style>
:root {
  --bg: #f2eafa;
  --card: #ffffffd9;
  --text: #594568;
  --accent: #b89ad4;
  --muted: #9987a6;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 14px;
  font-family: "Trebuchet MS", sans-serif;
  color: var(--text);
  background: radial-gradient(circle, white 1px, transparent 2px), linear-gradient(140deg, #eee2fa, #fff8ff, #e7dcf4);
  background-size: 35px 35px, auto;
}
.card {
  width: 100%;
  max-width: 380px;
  padding: 32px 22px;
  text-align: center;
  border: 1px solid #ffffff;
  border-radius: 28px;
  background: var(--card);
  box-shadow: 0 15px 45px #8f73a52b;
}
.avatar {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid white;
  background: #e9dcf3;
}
h1 { margin: 16px 0 6px; font-size: 27px; }
.small { color: var(--muted); font-size: 13px; }
.heart { font-size: 32px; color: var(--accent); margin: 16px; }
.bio { line-height: 1.7; font-size: 14px; }
.tags { margin: 20px 0; }
.tag {
  display: inline-block;
  padding: 7px 11px;
  margin: 3px;
  border: 1px solid #e4d5f0;
  border-radius: 20px;
  font-size: 12px;
}
.links { display: grid; gap: 10px; }
.links a {
  text-decoration: none;
  color: var(--text);
  padding: 13px;
  border: 1px solid #e3d5ee;
  border-radius: 14px;
  background: #fff9ff;
}
.links a:hover { background: #f1e6fa; }
footer { margin-top: 22px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<main class="card">
  <img class="avatar" src="https://placehold.co/300x300/e9dcf3/765987?text=your+avatar" alt="My avatar">
  <h1>your name ♡</h1>
  <div class="small">your pronouns · your timezone</div>
  <div class="heart">♡</div>
  <p class="bio">welcome to my little corner of the internet ✧<br>stay a little, look around, and have a lovely day.</p>
  <div class="tags">
    <span class="tag">♡ music</span>
    <span class="tag">games</span>
    <span class="tag">cute things</span>
  </div>
  <nav class="links">
    <a href="https://instagram.com/">♡ instagram</a>
    <a href="https://discord.com/">୨୧ discord</a>
    <a href="mailto:hello@example.com">✉ contact me</a>
  </nav>
  <footer>made with ♡ by me</footer>
</main>
</body>
</html>
